name: tests_workflow

on: push

jobs:
  build:
    name: Build image and push to registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Dockerhub
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: pavelsergeev/kittens-store:${{ github.sha }}

  test:
    name: Run autotests
    environment: test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
      - name: Set up Docker compose
        uses: docker/setup-compose-action@v1
      - name: Run app in compose and populate db
        working-directory: ${{ github.workspace }}/infra
        run: |
          echo DB_NAME=${{ secrets.DATABASE_NAME }} > .env
          echo POSTGRES_USER=${{ secrets.DATABASE_USER }} >> .env
          echo POSTGRES_PASSWORD=${{ secrets.DATABASE_PASSWORD }} >> .env
          echo DB_HOST=${{ secrets.DATABASE_HOST }} >> .env
          echo DB_PORT=${{ secrets.DATABASE_PORT }} >> .env
          echo DATABASE_URL=postgres://${{ secrets.DATABASE_USER }}:${{ secrets.DATABASE_PASSWORD }}@${{ secrets.DATABASE_HOST }}:${{ secrets.DATABASE_PORT }}/${{ secrets.DATABASE_NAME }} >> .env
          echo RACK_ENV=test >> .env
          export IMAGE_TAG=${{ github.sha }}
          docker compose up -d
          docker compose ps
          docker compose logs
          docker compose exec app bundle exec rake db:create --trace
          docker compose exec app bundle exec rake db:migrate
          docker compose exec app bundle exec rake db:seed
      - name: Run tests
        run: docker compose exec app bundle exec rspec

