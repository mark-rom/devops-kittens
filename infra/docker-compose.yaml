services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file: 
      - .env

  app:
    image: pavelsergeev/kittens-store:${IMAGE_TAG:-latest}
    # build:
    #   context: ../.
    #   dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "1234:1234"
    env_file: 
      - .env

volumes:
  db_data: