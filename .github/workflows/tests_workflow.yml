name: tests_workflow

on: 
  push:
    branches-ignore:
      - master
      - develop
  pull_request:
    types: [opened, edited]
    branches: [master, develop]

jobs:
  build:
    name: Build image and push to registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push to Dockerhub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: pavelsergeev/kittens-store:${{ github.sha }}

  test:
    name: Run autotests
    # environment: test
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/master' && 'production' || github.ref == 'refs/heads/develop' && 'development' || 'test' }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Create .env file
        working-directory: ${{ github.workspace }}/infra
        run: |
          echo "RACK_ENV is set to: ${{ vars.RACK_ENV }}"
          cat << EOF > .env
          DB_NAME=${{ secrets.DATABASE_NAME }}
          POSTGRES_USER=${{ secrets.DATABASE_USER }}
          POSTGRES_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DB_HOST=${{ secrets.DATABASE_HOST }}
          DB_PORT=${{ secrets.DATABASE_PORT }}
          DATABASE_URL=postgres://${{ secrets.DATABASE_USER }}:${{ secrets.DATABASE_PASSWORD }}@${{ secrets.DATABASE_HOST }}:${{ secrets.DATABASE_PORT }}/${{ secrets.DATABASE_NAME }}
          RACK_ENV=${{ vars.RACK_ENV }}
          IMAGE_TAG=${{ github.sha }}
          EOF
      - name: Start docker compose and wait for services to be ready
        working-directory: ${{ github.workspace }}/infra
        run: |
          docker compose up -d
          echo "Waiting for services to start..."
          sleep 10
      - name: Populate database with test data
        working-directory: ${{ github.workspace }}/infra
        run: |
          docker compose exec app bundle exec rake db:create
          docker compose exec app bundle exec rake db:migrate
          docker compose exec app bundle exec rake db:seed
      - name: Run tests
        working-directory: ${{ github.workspace }}/infra
        run: docker compose exec app bundle exec rspec
      - name: Cleanup
        if: always()
        working-directory: ${{ github.workspace }}/infra
        run: docker compose down

